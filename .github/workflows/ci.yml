name: Product Service CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yokeshr21/product-service-cicd

jobs:
  build-and-test:

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.token=$SONAR_TOKEN

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3

        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5

        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6

        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            
            
  deploy:
    name: Deploy to EC2

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: build-and-test

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ghcr.io/yokeshr21/product-service-cicd:${{ github.sha }}

        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "$DEPLOY_KEY" > deploy_key

          trap 'rm -f deploy_key' EXIT

          ssh -i deploy_key \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s" <<EOF

          set -e

          docker pull "$IMAGE"

          docker stop product-service || true

          docker rm product-service || true

          docker run -d \
            --restart unless-stopped \
            --name product-service \
            -p 8080:8080 \
            "$IMAGE"
          
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors \
            http://localhost:8080/products/1

          EOF